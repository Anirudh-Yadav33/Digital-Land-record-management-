services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: digital-land-backend
    container_name: digital_land_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=digital-land-registry-secret-key-2026
      - NODE_ENV=production
    volumes:
      - ./backend/data.json:/app/data.json
      - ./backend/uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: digital-land-frontend
    container_name: digital_land_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
